services:
  db:
    image: postgres:16-alpine
    container_name: bot-seller-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot_seller
      POSTGRES_PASSWORD: bot_seller_dev_local
      POSTGRES_DB: bot_seller
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_seller -d bot_seller"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    external: true
    name: bot-seller-pgdata
